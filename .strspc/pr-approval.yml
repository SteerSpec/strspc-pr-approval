# This repository's own policy: the SteerSpec preset, with merging switched on
# for release PRs (dogfooding MERGE-001..005).
#
# The preset is extended at the release tag the caller runs, like any consumer,
# not from this branch: a preset change that adds a key would otherwise reach
# main before a release that understands it, and the pinned action would
# reject the whole policy (#21). Bump this tag together with the SHA in
# .github/workflows/pr-approval.yml.
version: 1
realm: ../rules
extends:
  - github://SteerSpec/strspc-pr-approval@v1.2.0/presets/steerspec.yml
policies:
  - id: release
    kind: release
    rules: [APPROVE-006, MERGE-001]
    match: { base: main }
    options:
      author: steerspec-sync[bot]
      source: develop
    merge: { enabled: true, method: merge }
