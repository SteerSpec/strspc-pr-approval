name: E2E

# Runs the scenarios in e2e/pr-approval against the sandbox in
# testbed-multi-org, with the action pinned to the commit under test. It writes
# to that sandbox only: it opens and closes PRs, merges into its develop, and
# commits the caller, a CI stub and the policy to its main.
#
# Manual for now. One sandbox serves every run, so runs queue in the group below
# (GitHub keeps one pending run and cancels an older pending one, which a manual
# trigger can live with).
#
# The code under test runs IN the sandbox, with the sandbox's own secrets
# (BOT_TOKEN_SANDBOX, the steerspec-sync-testbed App). This job only holds
# E2E_ADMIN_TOKEN, the enterprise owner's, which the harness needs to commit to
# the sandbox's main and merge with bypass.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-sandbox
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
      E2E_EXPECT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Put this commit under test
        timeout-minutes: 5
        run: e2e/pr-approval/sandbox.sh sync "$E2E_EXPECT_SHA"
      - name: Run the scenarios
        timeout-minutes: 50
        run: e2e/pr-approval/run.sh
